  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border-radius: 999px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  overflow: hidden;
  isolation: isolate;
  transition: transform 0.15s cubic-bezier(.3,.7,.4,1.4), box-shadow 0.25s, background-color 0.2s, border-color 0.2s, color 0.2s, opacity 0.2s;
}
.bb-btn:active {
  transform: scale(0.95);
}
.bb-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
.bb-btn--hot {
  color: #fff;
  background: var(--hot);
  background-size: 160% 100%;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14) inset,
    0 10px 30px -8px rgba(255, 77, 109, 0.65),
    0 0 50px -10px rgba(255, 92, 214, 0.7);
}
.bb-btn--hot:hover:not(:disabled) {
  background-position: 100% 0;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22) inset,
    0 14px 40px -8px rgba(255, 77, 109, 0.8),
    0 0 70px -6px rgba(255, 92, 214, 0.85);
  transform: translateY(-2px);
}
.bb-btn--hot::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.45) 50%, transparent 70%);
  transform: translateX(-120%);
  z-index: 1;
  pointer-events: none;
}
.bb-btn--hot:hover:not(:disabled)::after {
  animation: bb-shine 0.9s ease;
}
@keyframes bb-shine {
  to {
    transform: translateX(120%);
  }
}
.bb-btn--glass {
  color: var(--text);
  background: rgba(34, 26, 77, 0.55);
  border: 1px solid var(--line-strong);
}
.bb-btn--glass:hover:not(:disabled) {
  background: rgba(46, 36, 102, 0.75);
  border-color: rgba(255, 255, 255, 0.35);
  box-shadow: 0 0 30px -8px rgba(139, 92, 255, 0.7);
  transform: translateY(-1px);
}
.bb-btn--tint {
  color: var(--text);
  background: var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--c) 16%, transparent);
  }
  border: 1px solid var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
}
.bb-btn--tint:hover:not(:disabled) {
  background: var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--c) 26%, transparent);
  }
  box-shadow: 0 0 28px -6px var(--c);
  transform: translateY(-1px);
}
.bb-play {
  position: relative;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  background: radial-gradient(circle at 35% 30%, #ff7a95, #ff4d6d 40%, #c2185b 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35),
    inset 0 -6px 14px rgba(0, 0, 0, 0.25),
    0 0 calc(30px + var(--kick-hit) * 50px) calc(var(--kick-hit) * 8px) rgba(255, 77, 109, calc(0.55 + var(--kick-hit) * 0.4));
  transform: scale(calc(1 + var(--kick-hit) * 0.06));
  transition: background 0.3s, transform 0.15s cubic-bezier(.3,.7,.4,1.4);
}
.bb-play[data-playing='false'] {
  background: radial-gradient(circle at 35% 30%, #5ffadb, #2df5c4 40%, #0e9f80 100%);
  color: #06281f;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45),
    inset 0 -6px 14px rgba(0, 0, 0, 0.2),
    0 0 40px -4px rgba(45, 245, 196, 0.6);
  animation: bb-breathe 2.6s ease-in-out infinite;
}
.bb-play:active {
  transform: scale(0.92);
}
@keyframes bb-breathe {
  0%, 100% {
    box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -6px 14px rgba(0,0,0,.2), 0 0 30px -6px rgba(45,245,196,.5);
  }
  50% {
    box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -6px 14px rgba(0,0,0,.2), 0 0 60px 0 rgba(45,245,196,.8);
  }
}
.bb-pad {
  --c: #fff;
  position: relative;
  border-radius: 9px;
  background: linear-gradient(180deg, #2a2160, #1d1645);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 -2px 0 rgba(0, 0, 0, 0.3);
  transition: background-color 0.12s, box-shadow 0.18s, transform 0.12s cubic-bezier(.3,.7,.4,1.6);
  cursor: pointer;
}
.bb-pad:hover {
  background: linear-gradient(180deg, #352a78, #241b56);
  box-shadow: inset 0 0 0 1px var(--c), 0 0 14px -4px var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent), 0 0 14px -4px var(--c);
  }
}
.bb-pad:active {
  transform: scale(0.86);
}
.bb-pad[data-beat='true']:not([data-on='true']) {
  background: linear-gradient(180deg, #31276d, #221a50);
}
.bb-pad[data-now='true']:not([data-on='true']) {
  background: linear-gradient(180deg, #4a3d99, #33287a);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
}
.bb-pad[data-on='true'] {
  background: radial-gradient(circle at 50% 35%, var(--c) 0%, var(--c) 55%, var(--c) 100%);
  @supports (color: color-mix(in lab, red, red)) {
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000) 100%);
  }
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55),
    0 0 10px var(--c),
    0 0 26px -2px var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55),
    0 0 10px color-mix(in srgb, var(--c) 80%, transparent),
    0 0 26px -2px color-mix(in srgb, var(--c) 55%, transparent);
  }
  animation: bb-pad-on 0.38s cubic-bezier(.3,.7,.4,1.6);
}
.bb-pad[data-on='true'][data-now='true'] {
  z-index: 2;
}
.bb-pad[data-on='true'][data-now='true']::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.85), var(--c) 55%, transparent 75%);
  @supports (color: color-mix(in lab, red, red)) {
    background: radial-gradient(circle, rgba(255, 255, 255, 0.85), color-mix(in srgb, var(--c) 60%, transparent) 55%, transparent 75%);
  }
  box-shadow: 0 0 22px var(--c), 0 0 60px 8px var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 22px var(--c), 0 0 60px 8px color-mix(in srgb, var(--c) 65%, transparent);
  }
  animation: bb-pad-hit 0.45s ease-out forwards;
}
.bb-pad[data-muted='true'][data-on='true'] {
  background: var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--c) 30%, #1d1645);
  }
  box-shadow: none;
}
.bb-pad[data-muted='true'][data-on='true']::after {
  display: none;
}
@keyframes bb-pad-on {
  0% {
    transform: scale(0.6);
    filter: brightness(2.2);
  }
  60% {
    transform: scale(1.12);
  }
  100% {
    transform: scale(1);
    filter: brightness(1);
  }
}
@keyframes bb-pad-hit {
  0% {
    opacity: 1;
    transform: scale(1.25);
  }
  100% {
    opacity: 0;
    transform: scale(1.6);
  }
}
.bb-beam {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 10px;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.0), rgba(255, 255, 255, 0.07) 20%, rgba(255, 255, 255, 0.07) 80%, rgba(255, 255, 255, 0));
  box-shadow: 0 0 40px 2px rgba(185, 178, 232, 0.12);
  transition: transform 0.06s linear, opacity 0.2s;
}
.bb-range {
  --c: var(--melody);
  --val: 50%;
  width: 100%;
  height: 26px;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
.bb-range::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--c), var(--c)) 0 / var(--val) 100% no-repeat,
    rgba(185, 178, 232, 0.16);
  @supports (color: color-mix(in lab, red, red)) {
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, transparent), var(--c)) 0 / var(--val) 100% no-repeat,
    rgba(185, 178, 232, 0.16);
  }
  box-shadow: 0 0 14px -2px var(--c);

    box-shadow: 0 0 14px -2px color-mix(in srgb, var(--c) 60%, transparent);
  }
}
.bb-range::-moz-range-track {
  height: 6px;
  border-radius: 999px;
  background: rgba(185, 178, 232, 0.16);
}
.bb-range::-moz-range-progress {
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--c), var(--c));

    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, transparent), var(--c));

.bb-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: -7px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--c);
  box-shadow: 0 0 0 4px var(--c), 0 0 18px var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent), 0 0 18px var(--c);
  }
  transition: transform 0.15s;
}
.bb-range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--c);
  box-shadow: 0 0 0 4px var(--c), 0 0 18px var(--c);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent), 0 0 18px var(--c);
  }

.bb-range:hover::-webkit-slider-thumb {

.bb-range:active::-webkit-slider-thumb {

  cursor: grabbing;
}
.bb-spectrum-text {
  background: var(--spectrum);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: bb-flow 9s linear infinite;
}
@keyframes bb-flow {
  to {
    background-position: 300% 0;
  }
}
.bb-glow-text {
  text-shadow: 0 0 calc(18px + var(--kick-hit) * 30px) rgba(255, 92, 214, calc(0.35 + var(--kick-hit) * 0.5));
}
.bb-shimmer {
  background: linear-gradient(90deg, var(--text-dim) 0%, #fff 50%, var(--text-dim) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: bb-shimmer 1.4s linear infinite;
}
@keyframes bb-shimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}
.bb-eq span {
  display: block;
  width: 4px;
  border-radius: 4px;
  transform-origin: bottom;
  animation: bb-eq 1.1s ease-in-out infinite;
  animation-play-state: paused;
}
.bb-eq[data-live='true'] span {
  animation-play-state: running;
}
.bb-eq span:nth-child(2) {
  animation-delay: -0.35s;
  animation-duration: 0.8s;
}
.bb-eq span:nth-child(3) {
  animation-delay: -0.6s;
  animation-duration: 1.3s;
}
.bb-eq span:nth-child(4) {
  animation-delay: -0.15s;
  animation-duration: 0.95s;
}
@keyframes bb-eq {
  0%, 100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}
@keyframes bb-attract {
  0%, 100% {
    opacity: 0.12;
    transform: scale(0.94);
  }
  8% {
    opacity: 1;
    transform: scale(1.04);
  }
  30% {
    opacity: 0.12;
    transform: scale(0.94);
  }
}
.bb-attract {
  animation: bb-attract 3.2s ease-in-out infinite;
}
.bb-marquee {
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
}
.bb-marquee__track {
  display: flex;
  width: max-content;
  animation: bb-marquee 38s linear infinite;
}
.bb-marquee:hover .bb-marquee__track {
  animation-play-state: paused;
}
@keyframes bb-marquee {
  to {
    transform: translateX(-50%);
  }
}
.bb-float {
  animation: bb-float 6s ease-in-out infinite;
}
@keyframes bb-float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}
.bb-meter {
  height: 100%;
  width: 100%;
  border-radius: 999px;
  background: var(--c);
  box-shadow: 0 0 12px var(--c);
  transform-origin: left;
  transform: scaleX(0);
  opacity: 0;
}
.bb-meter[data-hit='true'] {
  animation: bb-meter 0.45s cubic-bezier(.2,.7,.3,1);
}
@keyframes bb-meter {
  0% {
    transform: scaleX(var(--lvl, 1));
    opacity: 1;
  }
  100% {
    transform: scaleX(0);
    opacity: 0.2;
  }
}
.bb-scroll {
  scrollbar-width: thin;
  scrollbar-color: rgba(185,178,232,.25) transparent;
}
.bb-scroll::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}
.bb-scroll::-webkit-scrollbar-thumb {
  background: rgba(185, 178, 232, 0.25);
  border-radius: 999px;
}
[data-sonner-toaster] [data-sonner-toast] {
  background: rgba(26, 20, 64, 0.92) !important;
  border: 1px solid var(--line-strong) !important;
  color: var(--text) !important;
  backdrop-filter: blur(16px);
  border-radius: 18px !important;
  box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8), 0 0 40px -16px rgba(255, 92, 214, 0.6) !important;
  font-family: var(--font-body);
}
[data-sonner-toaster] [data-sonner-toast] [data-description] {
  color: var(--text-dim) !important;

  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .bb-stage__blob {
    transform: none;
  }
}
