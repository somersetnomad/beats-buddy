<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset=".5" stop-color="#ff5cd6"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <radialGradient id="bg" cx=".3" cy=".2" r="1">
      <stop offset="0" stop-color="#2a1f63"/>
      <stop offset="1" stop-color="#0d0a1f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <rect x="11" y="28" width="8" height="24" rx="4" fill="#ff4d6d"/>
    <rect x="23" y="13" width="8" height="39" rx="4" fill="url(#g)"/>
    <rect x="35" y="20" width="8" height="32" rx="4" fill="#8b5cff"/>
    <rect x="47" y="33" width="8" height="19" rx="4" fill="#2df5c4"/>
  </g>
</svg>
